<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Control Center | ECE Portfolio CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter'], mono: ['Fira Code'] }, colors: { silicon: { 950: '#050811', 900: '#0a0f1d' } } } } }
  </script>
  <style> body { background-color: #050811; color: #e2e8f0; } </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 bg-silicon-950/90 border-b border-cyan-500/20 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <i data-lucide="shield-alert" class="w-6 h-6 text-cyan-400"></i>
      <span class="font-mono font-bold text-sm text-white">PORTFOLIO_ADMIN_CMS <span class="text-[10px] text-emerald-400 block">GITHUB API AUTO-SYNC ACTIVE</span></span>
    </div>
    <div class="flex space-x-4">
      <a href="index.html" class="text-xs font-mono text-cyan-400">View Site</a>
      <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs font-mono text-red-400">Logout</button>
    </div>
  </header>

  <!-- LOGIN -->
  <section id="login-screen" class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-silicon-900 border border-cyan-500/30 rounded-2xl p-8">
      <h1 class="text-xl font-bold text-white mb-6"><i data-lucide="lock" class="inline w-5 h-5 text-cyan-400 mr-2"></i>Admin Login</h1>
      <form onsubmit="handleLogin(event)" class="space-y-4" autocomplete="off">
        <input type="email" id="login-email" required placeholder="Admin Email" class="w-full bg-silicon-950 border border-slate-800 rounded-lg p-3 text-white font-mono text-xs" />
        <input type="password" id="login-password" required placeholder="Passkey" class="w-full bg-silicon-950 border border-slate-800 rounded-lg p-3 text-white font-mono text-xs" />
        <div id="login-error" class="hidden text-xs text-red-400 bg-red-950/40 border border-red-800 p-2 rounded">Error.</div>
        <button type="submit" class="w-full py-3 rounded-lg bg-cyan-500 text-slate-950 font-bold font-mono text-xs">Unlock</button>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <main id="cms-dashboard" class="hidden flex-1 max-w-5xl mx-auto px-6 py-8 w-full">
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-emerald-950 border border-emerald-500 text-emerald-300 px-4 py-3 rounded-xl font-mono text-xs shadow-xl transition-all">Saved!</div>
    
    <div class="flex flex-wrap gap-2 py-4 mb-6 border-b border-slate-800 font-mono text-xs">
      <button onclick="switchTab('profile')" class="tab-btn px-4 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold">1. Profile</button>
      <button onclick="switchTab('journey')" class="tab-btn px-4 py-2 rounded-lg bg-silicon-900 text-slate-300">2. Edu</button>
      <button onclick="switchTab('projects')" class="tab-btn px-4 py-2 rounded-lg bg-silicon-900 text-slate-300">3. Projects</button>
      <button onclick="switchTab('experience')" class="tab-btn px-4 py-2 rounded-lg bg-silicon-900 text-slate-300">4. Experience</button>
      <button onclick="switchTab('cloud')" class="tab-btn px-4 py-2 rounded-lg bg-silicon-900 text-amber-400">⚡ GitHub Settings</button>
    </div>

    <!-- PROFILE TAB -->
    <div id="tab-profile" class="tab-panel">
      <form onsubmit="saveProfile(event)" class="grid grid-cols-2 gap-4 text-sm bg-silicon-900 border border-slate-800 p-6 rounded-xl">
        <div class="col-span-2"><label class="text-xs text-slate-400">Name</label><input id="prof-name" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded" /></div>
        <div class="col-span-2"><label class="text-xs text-slate-400">Headline</label><input id="prof-headline" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded" /></div>
        <div class="col-span-2"><label class="text-xs text-slate-400">Bio</label><textarea id="prof-bio" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded"></textarea></div>
        <div><label class="text-xs text-slate-400">Email</label><input id="prof-email" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded" /></div>
        <div><label class="text-xs text-slate-400">Location</label><input id="prof-location" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded" /></div>
        <div><label class="text-xs text-slate-400">GitHub URL</label><input id="prof-github" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded" /></div>
        <div><label class="text-xs text-slate-400">LinkedIn URL</label><input id="prof-linkedin" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded" /></div>
        <div class="col-span-2"><button type="submit" class="px-6 py-2 bg-cyan-500 text-slate-950 font-bold rounded">Save Profile</button></div>
      </form>
    </div>

    <!-- JOURNEY TAB -->
    <div id="tab-journey" class="tab-panel hidden grid grid-cols-2 gap-6">
      <form id="journey-form" onsubmit="addJourneyItem(event)" class="bg-silicon-900 border border-slate-800 p-6 rounded-xl space-y-3">
        <input id="j-type" placeholder="Type (e.g. Lab, Workshop)" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="j-title" placeholder="Title" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="j-inst" placeholder="Institution" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="j-period" placeholder="Period" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <textarea id="j-desc" placeholder="Description" rows="4" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs"></textarea>
        <button type="submit" class="w-full py-2 bg-cyan-500 text-slate-950 font-bold rounded text-xs">Add Journey</button>
      </form>
      <div id="journey-list" class="space-y-3"></div>
    </div>

    <!-- PROJECTS TAB -->
    <div id="tab-projects" class="tab-panel hidden grid grid-cols-2 gap-6">
      <form id="project-form" onsubmit="addProjectItem(event)" class="bg-silicon-900 border border-slate-800 p-6 rounded-xl space-y-3">
        <input id="p-title" placeholder="Project Title" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="p-category" placeholder="Category (Embedded, VLSI, Analog)" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="p-tech" placeholder="Tech Stack" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="p-summary" placeholder="Summary" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <textarea id="p-body" placeholder="Detailed Body" rows="4" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs"></textarea>
        <input id="p-image" placeholder="Image URL (Optional)" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="p-github" placeholder="GitHub URL (Optional)" class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <button type="submit" class="w-full py-2 bg-cyan-500 text-slate-950 font-bold rounded text-xs">Publish Project</button>
      </form>
      <div id="projects-list" class="space-y-3"></div>
    </div>

    <!-- EXPERIENCE TAB -->
    <div id="tab-experience" class="tab-panel hidden grid grid-cols-2 gap-6">
      <form id="exp-form" onsubmit="addExpItem(event)" class="bg-silicon-900 border border-slate-800 p-6 rounded-xl space-y-3">
        <input id="e-role" placeholder="Role (e.g. GET)" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="e-company" placeholder="Company" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <input id="e-duration" placeholder="Duration" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
        <textarea id="e-desc" placeholder="Bullet points of experience" rows="4" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs"></textarea>
        <button type="submit" class="w-full py-2 bg-cyan-500 text-slate-950 font-bold rounded text-xs">Add Experience</button>
      </form>
      <div id="exp-list" class="space-y-3"></div>
    </div>

    <!-- GITHUB CONFIG TAB -->
    <div id="tab-cloud" class="tab-panel hidden space-y-6">
      <div class="bg-silicon-900 border border-slate-800 p-6 rounded-xl">
        <h2 class="text-white font-bold text-lg mb-4">GitHub Auto-Sync Setup</h2>
        <form onsubmit="saveGitHubConfig(event)" class="space-y-4">
          <input type="text" id="gh-user" placeholder="GitHub Username (e.g. paradox2026)" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
          <input type="text" id="gh-repo" placeholder="Repository Name (e.g. ece-portfolio)" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
          <input type="password" id="gh-token" placeholder="Personal Access Token (ghp_...)" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
          <p class="text-[10px] text-slate-400">Get a token from GitHub Settings > Developer Settings > Personal Access Tokens (Classic). Ensure it has the "repo" box checked.</p>
          <button type="submit" class="px-6 py-2 bg-amber-500 text-slate-950 font-bold rounded text-xs">Connect to GitHub</button>
        </form>
      </div>
      <!-- Passkey Reset Tool -->
      <div class="bg-silicon-900 border border-slate-800 p-6 rounded-xl">
        <h2 class="text-white font-bold text-lg mb-4">Change Admin Login Passkey</h2>
        <form onsubmit="updateAdminCredentials(event)" class="space-y-4">
          <input type="email" id="new-admin-email" placeholder="New Admin Email" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
          <input type="password" id="new-admin-pass" placeholder="New Admin Passkey" required class="w-full bg-silicon-950 p-2 text-white border border-slate-800 rounded text-xs" />
          <button type="submit" class="px-6 py-2 bg-slate-700 text-white font-bold rounded text-xs">Update Credentials (SHA-256)</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    
    // Auth & Crypto
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function handleLogin(e) {
      e.preventDefault();
      const em = document.getElementById('login-email').value.trim().toLowerCase();
      const ps = document.getElementById('login-password').value;
      const emH = await sha256(em); const psH = await sha256(ps);
      const saved = JSON.parse(localStorage.getItem('ece_cms_auth_hashes') || 'null');
      let ok = false;
      if(saved) { ok = (emH === saved.emailHash && psH === saved.passHash); }
      else { ok = (emH === await sha256('admin@ece.com') && psH === await sha256('paradox2026')); }
      if(ok) {
        sessionStorage.setItem('ece_cms_logged_in', 'true');
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('cms-dashboard').classList.remove('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        loadAllForms();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }
    function handleLogout() { sessionStorage.removeItem('ece_cms_logged_in'); window.location.reload(); }
    async function updateAdminCredentials(e) {
      e.preventDefault();
      const emailHash = await sha256(document.getElementById('new-admin-email').value.trim().toLowerCase());
      const passHash = await sha256(document.getElementById('new-admin-pass').value);
      localStorage.setItem('ece_cms_auth_hashes', JSON.stringify({emailHash, passHash}));
      showToast("Passkey Updated.");
    }

    // CMS Engine & GitHub Auto-Sync
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }
    function getStore(k, f) { try{ return JSON.parse(localStorage.getItem(k)) || f; }catch{return f;} }
    
    // THE MAGIC FUNCTION: Saves locally AND pushes to GitHub
    async function setStore(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
      showToast("Saved! Syncing to GitHub...");
      const gh = getStore('ece_cms_github', null);
      if(gh && gh.token && gh.user && gh.repo) {
        try {
          const payload = {
            profile: getStore('ece_cms_profile', {}),
            journey: getStore('ece_cms_journey', []),
            projects: getStore('ece_cms_projects', []),
            experience: getStore('ece_cms_exp', [])
          };
          const jsonStr = JSON.stringify(payload, null, 2);
          const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));
          const url = `https://api.github.com/repos/${gh.user}/${gh.repo}/contents/data.json`;
          
          let sha = '';
          const getRes = await fetch(url, { headers: { 'Authorization': `token ${gh.token}` }});
          if(getRes.ok) { const d = await getRes.json(); sha = d.sha; }

          const putBody = { message: "Admin CMS Auto-Update", content: base64Content };
          if(sha) putBody.sha = sha;

          const putRes = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${gh.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(putBody)
          });

          if(putRes.ok) showToast("Live Sync Complete! Visitors will now see edits.");
          else showToast("Sync Error. Check GitHub Token scope.");
        } catch(err) {
          showToast("Sync Error.");
        }
      } else {
        showToast("Saved Locally. (Connect GitHub to sync live)");
      }
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('tab-'+t).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => b.className = "tab-btn px-4 py-2 rounded-lg bg-silicon-900 text-slate-300");
      event.target.className = "tab-btn px-4 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold";
    }

    function saveGitHubConfig(e) {
      e.preventDefault();
      localStorage.setItem('ece_cms_github', JSON.stringify({
        user: document.getElementById('gh-user').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        token: document.getElementById('gh-token').value.trim()
      }));
      showToast("GitHub Connection Saved!");
    }

    function loadAllForms() {
      const p = getStore('ece_cms_profile', {});
      document.getElementById('prof-name').value = p.name || '';
      document.getElementById('prof-headline').value = p.headline || '';
      document.getElementById('prof-bio').value = p.bio || '';
      document.getElementById('prof-email').value = p.email || '';
      document.getElementById('prof-location').value = p.location || '';
      document.getElementById('prof-github').value = p.github || '';
      document.getElementById('prof-linkedin').value = p.linkedin || '';
      const gh = getStore('ece_cms_github', {});
      if(gh.user) document.getElementById('gh-user').value = gh.user;
      if(gh.repo) document.getElementById('gh-repo').value = gh.repo;
      if(gh.token) document.getElementById('gh-token').value = gh.token;
      renderLists();
    }

    function saveProfile(e) {
      e.preventDefault();
      setStore('ece_cms_profile', {
        name: document.getElementById('prof-name').value, headline: document.getElementById('prof-headline').value,
        bio: document.getElementById('prof-bio').value, email: document.getElementById('prof-email').value,
        location: document.getElementById('prof-location').value, github: document.getElementById('prof-github').value,
        linkedin: document.getElementById('prof-linkedin').value
      });
    }

    function renderLists() {
      document.getElementById('journey-list').innerHTML = getStore('ece_cms_journey', []).map(i => `<div class="p-3 bg-silicon-950 rounded border border-slate-800 text-xs"><b class="text-cyan-400">${i.title}</b><p class="mt-1 whitespace-pre-line text-slate-400">${i.desc}</p><button onclick="del('ece_cms_journey','${i.id}')" class="text-red-400 mt-2">Delete</button></div>`).join('');
      document.getElementById('projects-list').innerHTML = getStore('ece_cms_projects', []).map(i => `<div class="p-3 bg-silicon-950 rounded border border-slate-800 text-xs"><b class="text-cyan-400">${i.title}</b><p class="mt-1 whitespace-pre-line text-slate-400">${i.summary}</p><button onclick="del('ece_cms_projects','${i.id}')" class="text-red-400 mt-2">Delete</button></div>`).join('');
      document.getElementById('exp-list').innerHTML = getStore('ece_cms_exp', []).map(i => `<div class="p-3 bg-silicon-950 rounded border border-slate-800 text-xs"><b class="text-cyan-400">${i.role}</b><p class="mt-1 whitespace-pre-line text-slate-400">${i.desc}</p><button onclick="del('ece_cms_exp','${i.id}')" class="text-red-400 mt-2">Delete</button></div>`).join('');
    }

    function addJourneyItem(e) { e.preventDefault(); const l = getStore('ece_cms_journey', []); l.unshift({ id: 'j'+Date.now(), type: document.getElementById('j-type').value, title: document.getElementById('j-title').value, inst: document.getElementById('j-inst').value, period: document.getElementById('j-period').value, desc: document.getElementById('j-desc').value }); setStore('ece_cms_journey', l); document.getElementById('journey-form').reset(); renderLists(); }
    function addProjectItem(e) { e.preventDefault(); const l = getStore('ece_cms_projects', []); l.unshift({ id: 'p'+Date.now(), title: document.getElementById('p-title').value, category: document.getElementById('p-category').value, tech: document.getElementById('p-tech').value, summary: document.getElementById('p-summary').value, body: document.getElementById('p-body').value, image: document.getElementById('p-image').value, github: document.getElementById('p-github').value }); setStore('ece_cms_projects', l); document.getElementById('project-form').reset(); renderLists(); }
    function addExpItem(e) { e.preventDefault(); const l = getStore('ece_cms_exp', []); l.unshift({ id: 'e'+Date.now(), role: document.getElementById('e-role').value, company: document.getElementById('e-company').value, duration: document.getElementById('e-duration').value, desc: document.getElementById('e-desc').value }); setStore('ece_cms_exp', l); document.getElementById('exp-form').reset(); renderLists(); }
    function del(key, id) { const l = getStore(key, []).filter(i => i.id !== id); setStore(key, l); renderLists(); }

    if (sessionStorage.getItem('ece_cms_logged_in') === 'true') {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('cms-dashboard').classList.remove('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
      loadAllForms();
    }
  </script>
</body>
</html>
